name: Expo CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: expo-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: SDK, contract, test, and export gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Restore node_modules cache
        id: node-modules-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            node_modules
            ~/.npm/_npx
          key: ${{ runner.os }}-app-node-modules-${{ hashFiles('package-lock.json', '.node-version') }}
          restore-keys: |
            ${{ runner.os }}-app-node-modules-

      - name: Install locked dependencies
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check Expo SDK health
        run: npx --yes expo-doctor@1.20.4

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run automated tests (optional)
        continue-on-error: true
        run: npm test || true

      - name: Restore Metro build cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .expo
            .metro-cache
          key: ${{ runner.os }}-app-metro-${{ hashFiles('package-lock.json', '.node-version') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-app-metro-${{ hashFiles('package-lock.json', '.node-version') }}-

      - name: Export Android JavaScript bundle
        run: npm run build
